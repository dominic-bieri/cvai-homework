services:

  tailscale:
    image: tailscale/tailscale:latest
    container_name: bee-tailscale
    restart: unless-stopped
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
    volumes:
      - ./tailscale-data:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - net_admin
      - sys_module

  counter:
    build: ./counter
    container_name: bee-counter
    restart: unless-stopped
    network_mode: service:tailscale
    depends_on:
      - tailscale
    env_file: .env
    volumes:
      - ./data:/data
      - ./model:/model:ro

  dashboard:
    build: ./dashboard
    container_name: bee-dashboard
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data
    env_file: .env
